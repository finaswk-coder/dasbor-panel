<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dasbor Panel</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="bg"></div>
  <div class="noise"></div>

  <header class="top">
    <div class="brand">
      <div class="logo">⚡</div>
      <div class="text">
        <h1>Dasbor Panel</h1>
        <p class="sub">Shortcut cepat YouTube, TikTok, Discord, IG dll</p>
      </div>
    </div>

    <div class="actions">
      <input id="q" class="search" placeholder="Cari: youtube, discord..." autocomplete="off"/>
      <button id="mode" class="btn ghost" title="Tema">🌙</button>
    </div>
  </header>

  <main class="wrap">

    <section class="stats">
      <div class="stat">
        <div class="k">Apps</div>
        <div class="v" id="countApps">0</div>
      </div>
      <div class="stat">
        <div class="k">Kategori</div>
        <div class="v" id="countCats">0</div>
      </div>
      <div class="stat">
        <div class="k">Tips</div>
        <div class="v small">Klik kartu → buka tab</div>
      </div>
    </section>

    <section class="toolbar">
      <div class="chips" id="chips"></div>
      <div class="rightTools">
        <button id="shuffle" class="btn ghost">🔀 Acak</button>
        <button id="reset" class="btn ghost">↩ Reset</button>
      </div>
    </section>

    <section class="grid" id="grid"></section>

    <footer class="foot">
      Tambah link? Edit di <code>app.js</code>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
